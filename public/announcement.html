<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>公告欄</title>

<style>
*{box-sizing:border-box;}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:radial-gradient(circle at top,#fff8ea 0%,#f4ead9 45%,#eadcc8 100%);
  color:#10201d;
}

.page{
  min-height:100vh;
  padding:24px 18px 44px;
}

.header{
  text-align:center;
  margin:18px 0 26px;
}

.brand{
  font-size:14px;
  letter-spacing:6px;
  color:#a9792b;
  font-weight:900;
}

h1{
  margin:12px 0 6px;
  font-size:38px;
  color:#0b3029;
  letter-spacing:3px;
}

.subtitle{
  color:#8b7d69;
  font-size:15px;
  letter-spacing:1px;
}

.card{
  max-width:720px;
  margin:0 auto;
}

.noticeCard{
  background:rgba(255,255,255,.94);
  border:1px solid #e4d4b8;
  border-radius:28px;
  padding:22px;
  margin-bottom:16px;
  box-shadow:0 18px 40px rgba(66,43,16,.12);
}

.pin{
  display:inline-block;
  margin-bottom:10px;
  padding:7px 13px;
  border-radius:999px;
  background:#f7ead0;
  color:#8a5f1e;
  font-weight:950;
  font-size:14px;
}

.title{
  font-size:24px;
  font-weight:950;
  color:#0b3029;
  margin-bottom:8px;
}

.date{
  color:#8b7d69;
  font-size:14px;
  font-weight:800;
  margin-bottom:14px;
}

.content{
  color:#10201d;
  line-height:1.8;
  font-size:16px;
  white-space:pre-wrap;
}

.empty{
  background:rgba(255,255,255,.94);
  border:1px solid #e4d4b8;
  border-radius:28px;
  padding:34px;
  text-align:center;
  color:#8b7d69;
  font-weight:900;
}

.backBtn{
  width:100%;
  max-width:720px;
  display:block;
  margin:20px auto 0;
  padding:16px;
  border:none;
  border-radius:20px;
  color:white;
  font-size:18px;
  font-weight:950;
  background:linear-gradient(135deg,#10201d,#050b0a);
}

@media(max-width:480px){
  h1{font-size:34px;}
  .title{font-size:22px;}
}
</style>
</head>

<body>

<div class="page">

  <div class="header">
    <div class="brand">AURUM HOUSE</div>
    <h1>公告欄</h1>
    <div class="subtitle">Announcements</div>
  </div>

  <div id="list" class="card">
    <div class="empty">公告讀取中...</div>
  </div>

  <button class="backBtn" onclick="goBack()">
    返回員工專區
  </button>

</div>

<script>
function goBack(){
  if(document.referrer){
    history.back();
  }else{
    location.href="/employee-home.html";
  }
}

function formatDateTime(value){
  if(!value){
    return "-";
  }

  const d = new Date(value);

  if(isNaN(d.getTime())){
    return value;
  }

  return d.toLocaleString("zh-TW", {
    timeZone:"Asia/Taipei",
    year:"numeric",
    month:"2-digit",
    day:"2-digit",
    hour:"2-digit",
    minute:"2-digit"
  });
}

async function loadAnnouncements(){
  const list = document.getElementById("list");

  try{
    const res = await fetch("/api/announcements");
    const data = await res.json();

    if(!res.ok || data.success === false){
      list.innerHTML =
      `<div class="empty">公告讀取失敗</div>`;
      return;
    }

    const rows = data.data || [];

    if(rows.length === 0){
      list.innerHTML =
      `<div class="empty">目前沒有公告</div>`;
      return;
    }

    list.innerHTML = rows.map(item=>`
      <div class="noticeCard">

        ${
          item.pinned
          ? `<div class="pin">置頂公告</div>`
          : ""
        }

        <div class="title">
          ${item.title || "-"}
        </div>

        <div class="date">
          發布時間：${formatDateTime(item.created_at)}
          ｜對象：${item.target || "全部"}
        </div>

        <div class="content">
          ${item.content || ""}
        </div>

      </div>
    `).join("");

  }catch(err){
    console.error(err);

    list.innerHTML =
    `<div class="empty">公告讀取失敗</div>`;
  }
}

loadAnnouncements();
</script>

</body>
</html>
