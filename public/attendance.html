<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>員工打卡</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>
*{box-sizing:border-box;}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:radial-gradient(circle at top,#fff8ea 0%,#f4ead9 45%,#eadcc8 100%);
  color:#10201d;
  padding:24px 18px 44px;
}

.header{
  text-align:center;
  margin:18px 0 26px;
}

.brand{
  font-size:14px;
  letter-spacing:6px;
  color:#a9792b;
  font-weight:900;
}

h1{
  margin:12px 0 6px;
  font-size:38px;
  color:#0b3029;
  letter-spacing:3px;
}

.subtitle{
  color:#8b7d69;
  font-size:15px;
  letter-spacing:1px;
}

.card{
  max-width:620px;
  margin:0 auto;
  padding:24px;
  border-radius:34px;
  background:rgba(255,255,255,.94);
  border:1px solid #e4d4b8;
  box-shadow:0 26px 60px rgba(66,43,16,.16);
}

.profile{
  display:flex;
  align-items:center;
  gap:18px;
  padding-bottom:20px;
  border-bottom:1px solid #eadfcf;
}

.logoBox{
  width:120px;
  height:80px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
}

.logoBox img{
  max-width:120px;
  max-height:80px;
  object-fit:contain;
  display:block;
}

.logoFallback{
  width:86px;
  height:60px;
  border-radius:18px;
  background:linear-gradient(135deg,#0b3029,#061514);
  color:#c9a45d;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  font-weight:950;
  letter-spacing:2px;
}

.name{
  font-size:29px;
  font-weight:950;
  color:#0b3029;
}

.role{
  margin-top:6px;
  color:#756957;
  font-size:16px;
}

.statusBox{
  margin-top:22px;
  background:#fffaf3;
  border:1px solid #eadfcf;
  border-radius:22px;
  padding:18px;
  text-align:left;
  line-height:1.8;
  font-size:16px;
}

.statusTitle{
  font-weight:950;
  margin-bottom:8px;
  color:#0b3029;
  font-size:18px;
}

.success{
  color:#166534;
  font-weight:950;
}

.error{
  color:#b91c1c;
  font-weight:950;
}

.info{
  color:#8a5f1e;
  font-weight:950;
}

.actions{
  margin-top:24px;
  display:grid;
  gap:14px;
}

button{
  width:100%;
  padding:17px;
  border:none;
  border-radius:20px;
  color:white;
  font-size:20px;
  font-weight:950;
  cursor:pointer;
  box-shadow:0 12px 26px rgba(0,0,0,.16);
}

button:active{
  transform:scale(.98);
}

.clockin{
  background:linear-gradient(135deg,#cfa54f,#8b5f1e);
}

.clockout{
  background:linear-gradient(135deg,#8b1e1e,#4a0f0f);
}

.refresh{
  background:linear-gradient(135deg,#123c35,#071b17);
}

.back{
  background:linear-gradient(135deg,#10201d,#050b0a);
}

.mapBox{
  margin-top:18px;
  border:1px solid #eadfcf;
  border-radius:22px;
  overflow:hidden;
  background:#fffaf3;
}

.mapBox iframe{
  width:100%;
  height:260px;
  border:0;
  display:block;
}

.mapActions{
  padding:12px;
}

.mapLink{
  display:block;
  text-align:center;
  text-decoration:none;
  padding:13px;
  border-radius:16px;
  background:linear-gradient(135deg,#123c35,#071b17);
  color:white;
  font-weight:950;
}

.footerNote{
  margin-top:18px;
  background:#fffaf3;
  border:1px solid #eadfcf;
  border-radius:18px;
  padding:14px;
  color:#756957;
  font-size:14px;
  line-height:1.7;
}

.gps{
  display:inline-block;
  margin-top:8px;
  padding:7px 12px;
  background:#f7ead0;
  color:#8a5f1e;
  border-radius:999px;
  font-size:13px;
  font-weight:900;
}

.loading{
  color:#8b7d69;
  font-weight:900;
}

@media(max-width:480px){
  h1{
    font-size:34px;
  }

  .card{
    padding:20px;
    border-radius:30px;
  }

  .profile{
    gap:14px;
  }

  .logoBox{
    width:108px;
    height:72px;
  }

  .logoBox img{
    max-width:108px;
    max-height:72px;
  }

  .name{
    font-size:27px;
  }

  button{
    font-size:18px;
  }

  .mapBox iframe{
    height:230px;
  }
}
</style>
</head>

<body>

<div class="header">
  <div class="brand">AURUM HOUSE</div>
  <h1>員工打卡</h1>
  <div class="subtitle">Attendance Clock System</div>
</div>

<div class="card">

  <div class="profile">

    <div class="logoBox">
      <img
        src="/images/logo.jpg"
        alt="Aurum House"
        onerror="this.style.display='none'; this.parentElement.innerHTML='<div class=logoFallback>AH</div>';"
      >
    </div>

    <div>
      <div id="employeeName" class="name">
        LINE 登入中...
      </div>

      <div id="employeeRole" class="role">
        請稍候...
      </div>
    </div>

  </div>

  <div id="status" class="statusBox">
    <div class="statusTitle">目前狀態</div>
    <div class="loading">正在確認員工資料...</div>
  </div>

  <div id="mapArea"></div>

  <div class="actions">

    <button class="clockin" onclick="clock('上班')">
      上班打卡
    </button>

    <button class="clockout" onclick="clock('下班')">
      下班打卡
    </button>

    <button class="refresh" onclick="location.reload()">
      重新整理
    </button>

    <button class="back" onclick="goBack()">
      返回員工專區
    </button>

  </div>

  <div class="footerNote">
    打卡時系統會取得 GPS 定位，用於出勤紀錄與位置確認。
    <br>
    <span class="gps">GPS 定位啟用</span>
  </div>

</div>

<script>
const LIFF_ID = "2010241581-YtDxQgWd";

let profile = null;
let employee = null;

function setStatus(html){
  document.getElementById("status").innerHTML = html;
}

function goBack(){
  if(document.referrer){
    history.back();
  }else{
    location.href = "/employee-home.html";
  }
}

function formatDateTime(value){
  const d = new Date(value || new Date());

  return d.toLocaleString("zh-TW", {
    timeZone:"Asia/Taipei",
    year:"numeric",
    month:"2-digit",
    day:"2-digit",
    hour:"2-digit",
    minute:"2-digit",
    second:"2-digit"
  });
}

function showMap(latitude, longitude){
  const lat =
  Number(latitude);

  const lng =
  Number(longitude);

  if(!lat || !lng){
    document.getElementById("mapArea").innerHTML = "";
    return;
  }

  const mapUrl =
  `https://www.google.com/maps?q=${lat},${lng}`;

  const embedUrl =
  `https://maps.google.com/maps?q=${lat},${lng}&z=17&output=embed`;

  document.getElementById("mapArea").innerHTML =
  `
  <div class="mapBox">
    <iframe
      src="${embedUrl}"
      loading="lazy"
      referrerpolicy="no-referrer-when-downgrade">
    </iframe>

    <div class="mapActions">
      <a class="mapLink" href="${mapUrl}" target="_blank">
        開啟 Google 地圖
      </a>
    </div>
  </div>
  `;
}

async function init(){
  const nameBox =
  document.getElementById("employeeName");

  const roleBox =
  document.getElementById("employeeRole");

  try{
    await liff.init({
      liffId: LIFF_ID
    });

    if(!liff.isLoggedIn()){
      liff.login();
      return;
    }

    profile =
    await liff.getProfile();

    const res =
    await fetch(
      "/api/check-employee/" +
      profile.userId
    );

    const data =
    await res.json();

    if(!data.success || !data.isEmployee){
      nameBox.innerHTML =
      "<span class='error'>未綁定員工</span>";

      roleBox.innerHTML =
      "請聯絡管理員完成 LINE 綁定";

      setStatus(`
        <div class="statusTitle">無法打卡</div>
        <div class="error">您尚未完成員工綁定。</div>
      `);

      return;
    }

    employee =
    data.employee;

    nameBox.innerHTML =
    employee.name || "-";

    roleBox.innerHTML =
    `${employee.department || "-"} / ${employee.position || "-"}`;

    setStatus(`
      <div class="statusTitle">目前狀態</div>
      <div class="success">已完成員工驗證，可以打卡。</div>
      <div>登入時間：${formatDateTime()}</div>
    `);

  }catch(error){
    console.error(error);

    nameBox.innerHTML =
    "<span class='error'>登入失敗</span>";

    roleBox.innerHTML =
    "請使用 LINE 開啟此頁面";

    setStatus(`
      <div class="statusTitle">系統訊息</div>
      <div class="error">登入失敗，請重新開啟頁面。</div>
    `);
  }
}

function getLocation(){
  return new Promise((resolve,reject)=>{
    if(!navigator.geolocation){
      reject("此裝置不支援定位");
      return;
    }

    navigator.geolocation.getCurrentPosition(
      position=>{
        resolve({
          latitude: position.coords.latitude,
          longitude: position.coords.longitude
        });
      },
      error=>{
        reject("無法取得定位，請開啟 GPS 權限");
      },
      {
        enableHighAccuracy:true,
        timeout:10000,
        maximumAge:0
      }
    );
  });
}

async function clock(type){
  if(!profile || !employee){
    alert("尚未完成 LINE 登入或員工驗證");
    return;
  }

  try{
    document.getElementById("mapArea").innerHTML = "";

    setStatus(`
      <div class="statusTitle">打卡處理中</div>
      <div class="info">正在取得 GPS 定位...</div>
    `);

    const location =
    await getLocation();

    showMap(
      location.latitude,
      location.longitude
    );

    setStatus(`
      <div class="statusTitle">打卡處理中</div>
      <div class="info">正在送出打卡資料...</div>
      <div>緯度：${location.latitude}</div>
      <div>經度：${location.longitude}</div>
    `);

    const res =
    await fetch(
      "/api/clock",
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify({
          lineUserId: profile.userId,
          name: employee.name,
          type: type,
          latitude: location.latitude,
          longitude: location.longitude
        })
      }
    );

    const data =
    await res.json();

    if(!res.ok || data.success === false){
      setStatus(`
        <div class="statusTitle">打卡失敗</div>
        <div class="error">${data.message || "打卡失敗"}</div>
      `);
      return;
    }

    setStatus(`
      <div class="statusTitle">打卡完成</div>
      <div class="success">✅ ${type}打卡成功</div>
      <div>時間：${formatDateTime(data.time)}</div>
      <div>位置：${data.address || "已記錄 GPS 位置"}</div>
      <div>緯度：${location.latitude}</div>
      <div>經度：${location.longitude}</div>
    `);

  }catch(error){
    console.error(error);

    setStatus(`
      <div class="statusTitle">系統訊息</div>
      <div class="error">${error}</div>
    `);
  }
}

init();
</script>

</body>
</html>
