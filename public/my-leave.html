<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>我的請假紀錄</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>
*{box-sizing:border-box;}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:radial-gradient(circle at top,#fff8ea 0%,#f4ead9 45%,#eadcc8 100%);
  color:#10201d;
  padding:24px 18px 44px;
}

.header{
  text-align:center;
  margin:18px 0 26px;
}

.brand{
  font-size:14px;
  letter-spacing:6px;
  color:#a9792b;
  font-weight:900;
}

h1{
  margin:12px 0 6px;
  font-size:38px;
  color:#0b3029;
  letter-spacing:3px;
}

.subtitle{
  color:#8b7d69;
  font-size:15px;
  letter-spacing:1px;
}

.card{
  max-width:720px;
  margin:0 auto;
  padding:24px;
  border-radius:34px;
  background:rgba(255,255,255,.94);
  border:1px solid #e4d4b8;
  box-shadow:0 26px 60px rgba(66,43,16,.16);
}

.employeeBox{
  background:#fffaf3;
  border:1px solid #eadfcf;
  border-radius:22px;
  padding:18px;
  margin-bottom:22px;
  color:#0b3029;
  font-weight:950;
  line-height:1.7;
}

.leaveCard{
  background:#fffaf3;
  border:1px solid #eadfcf;
  border-radius:22px;
  padding:18px;
  margin-bottom:14px;
  text-align:left;
}

.leaveTop{
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:center;
  margin-bottom:12px;
}

.leaveType{
  font-size:20px;
  font-weight:950;
  color:#0b3029;
}

.dateText{
  color:#756957;
  line-height:1.7;
  font-weight:800;
}

.status{
  padding:8px 12px;
  border-radius:999px;
  font-size:14px;
  font-weight:950;
  white-space:nowrap;
}

.approved{
  background:#e7f7ec;
  color:#166534;
}

.rejected{
  background:#fdecec;
  color:#991b1b;
}

.pending{
  background:#fff4d6;
  color:#8a5f1e;
}

.empty{
  text-align:center;
  color:#756957;
  font-weight:900;
  padding:28px 10px;
}

.loading{
  text-align:center;
  color:#8b7d69;
  font-weight:900;
  padding:36px 10px;
}

.error{
  color:#b91c1c;
  font-weight:950;
}

.backBtn{
  width:100%;
  padding:16px;
  margin-top:16px;
  border:none;
  border-radius:20px;
  color:white;
  font-size:18px;
  font-weight:950;
  cursor:pointer;
  background:linear-gradient(135deg,#10201d,#050b0a);
}

@media(max-width:480px){
  h1{
    font-size:34px;
  }

  .card{
    padding:20px;
    border-radius:30px;
  }

  .leaveTop{
    align-items:flex-start;
  }
}
</style>

</head>

<body>

<div class="header">
  <div class="brand">AURUM HOUSE</div>
  <h1>我的請假紀錄</h1>
  <div class="subtitle">Leave Records</div>
</div>

<div class="card">

  <div id="employeeName" class="employeeBox">
    LINE 登入中...
  </div>

  <div id="leaveList">
    <div class="loading">讀取中...</div>
  </div>

  <button class="backBtn" onclick="goBack()">
    返回員工專區
  </button>

</div>

<script>

const LIFF_ID = "2010241581-YtDxQgWd";

let profile = null;

function goBack(){
  if(document.referrer){
    history.back();
  }else{
    location.href="/employee-home.html";
  }
}

function formatDate(value){

  if(!value){
    return "-";
  }

  const d = new Date(value);

  if(isNaN(d.getTime())){
    return value;
  }

  const week =
  ["日","一","二","三","四","五","六"];

  return d.toLocaleDateString("zh-TW",{
    timeZone:"Asia/Taipei",
    year:"numeric",
    month:"2-digit",
    day:"2-digit"
  })
  + "（週" +
  week[d.getDay()] +
  "）";
}
  if(!value){
    return "-";
  }

  const d = new Date(value);

  if(isNaN(d.getTime())){
    return value;
  }

  return d.toLocaleDateString("zh-TW", {
    timeZone:"Asia/Taipei",
    year:"numeric",
    month:"2-digit",
    day:"2-digit"
  });
  
}

function getStatusClass(status){
  if(status === "已核准" || status === "核准"){
    return "approved";
  }

  if(status === "已駁回" || status === "駁回"){
    return "rejected";
  }

  return "pending";
}

async function init(){
  try{
    await liff.init({
      liffId: LIFF_ID
    });

    if(!liff.isLoggedIn()){
      liff.login();
      return;
    }

    profile =
    await liff.getProfile();

    const empRes =
    await fetch(
      "/api/check-employee/" +
      profile.userId
    );

    const empData =
    await empRes.json();

    if(empData.success && empData.isEmployee){
      document.getElementById("employeeName").innerHTML =
      `員工：${empData.employee.name || profile.displayName || "-"}<br>
       部門：${empData.employee.department || "-"} / ${empData.employee.position || "-"}`;
    }else{
      document.getElementById("employeeName").innerHTML =
      `員工：${profile.displayName}`;
    }

    loadLeaves();

  }catch(err){
    console.error(err);

    document.getElementById("employeeName").innerHTML =
    "<span class='error'>LINE 登入失敗，請重新開啟頁面</span>";

    document.getElementById("leaveList").innerHTML =
    "";
  }
}

async function loadLeaves(){
  const list =
  document.getElementById("leaveList");

  list.innerHTML =
  `<div class="loading">讀取中...</div>`;

  try{
    const res =
    await fetch("/api/leaves");

    const data =
    await res.json();

    const myLeaves =
    Array.isArray(data)
    ? data.filter(item =>
        item.line_user_id === profile.userId
      )
    : [];

    if(myLeaves.length === 0){
      list.innerHTML =
      `<div class="empty">目前沒有請假紀錄</div>`;
      return;
    }

    list.innerHTML = "";

    myLeaves.forEach(item=>{
      const status =
      item.status || "待審核";

      const statusClass =
      getStatusClass(status);

      list.innerHTML += `
        <div class="leaveCard">

          <div class="leaveTop">
            <div class="leaveType">
              ${item.leave_type || "-"}
            </div>

            <div class="status ${statusClass}">
              ${status}
            </div>
          </div>

          <div class="dateText">
            開始日期：${formatDate(item.start_date)}<br>
            結束日期：${formatDate(item.end_date)}
          </div>

        </div>
      `;
    });

  }catch(err){
    console.error(err);

    list.innerHTML =
    `<div class="empty error">讀取失敗，請稍後再試</div>`;
  }
}

init();
</script>

</body>
</html>
