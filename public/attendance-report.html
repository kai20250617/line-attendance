<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>出勤統計報表</title>

<style>
*{box-sizing:border-box;}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:radial-gradient(circle at top,#fff8ea 0%,#f4ead9 45%,#eadcc8 100%);
  color:#10201d;
  padding:24px 18px 44px;
}

.page{max-width:1180px;margin:0 auto;}

.header{text-align:center;margin:18px 0 26px;}

.brand{
  font-size:14px;
  letter-spacing:6px;
  color:#a9792b;
  font-weight:900;
}

h1{
  margin:12px 0 6px;
  font-size:38px;
  color:#0b3029;
  letter-spacing:3px;
}

.subtitle{
  color:#8b7d69;
  font-size:15px;
  letter-spacing:1px;
}

.filterCard{
  background:rgba(255,255,255,.94);
  border:1px solid #e4d4b8;
  border-radius:30px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 18px 40px rgba(66,43,16,.12);
}

.filterGrid{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:12px;
}

input{
  width:100%;
  height:56px;
  padding:0 14px;
  border:1px solid #d8c8ad;
  border-radius:18px;
  background:#fffdf8;
  color:#10201d;
  font-size:15px;
  outline:none;
}

input:focus{
  border-color:#cfa54f;
  box-shadow:0 0 0 3px rgba(207,165,79,.18);
}

.actionGrid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-top:14px;
}

button{
  width:100%;
  padding:13px 14px;
  border:none;
  border-radius:18px;
  color:white;
  font-size:15px;
  font-weight:950;
  cursor:pointer;
}

.search{
  background:linear-gradient(135deg,#cfa54f,#8b5f1e);
}

.export{
  background:linear-gradient(135deg,#166534,#064e3b);
}

.clear{
  background:linear-gradient(135deg,#756957,#3b3025);
}

.back{
  background:linear-gradient(135deg,#10201d,#050b0a);
}

.monthTitle{
  background:rgba(255,255,255,.94);
  border:1px solid #e4d4b8;
  border-radius:24px;
  padding:16px;
  text-align:center;
  color:#0b3029;
  font-size:20px;
  font-weight:950;
  margin-bottom:18px;
}

.tableCard{
  background:rgba(255,255,255,.94);
  border:1px solid #e4d4b8;
  border-radius:30px;
  padding:16px;
  box-shadow:0 18px 40px rgba(66,43,16,.12);
}

.tableWrap{
  width:100%;
  overflow-x:auto;
}

table{
  width:100%;
  min-width:1050px;
  border-collapse:separate;
  border-spacing:0;
  overflow:hidden;
  border-radius:22px;
}

th{
  background:linear-gradient(135deg,#10201d,#050b0a);
  color:white;
  padding:14px 12px;
  white-space:nowrap;
  font-size:15px;
}

td{
  padding:14px 12px;
  text-align:center;
  white-space:nowrap;
  border-bottom:1px solid #eadfcf;
  color:#10201d;
  font-weight:800;
}

tr:nth-child(even) td{
  background:#fffaf3;
}

tr:nth-child(odd) td{
  background:#fffdf9;
}

.good{
  color:#166534;
  font-weight:950;
}

.bad{
  color:#b91c1c;
  font-weight:950;
}

.empty{
  color:#8b7d69;
  font-weight:900;
  padding:30px;
  text-align:center;
}

@media(max-width:800px){
  .filterGrid,
  .actionGrid{
    grid-template-columns:1fr;
  }
}

@media(max-width:480px){
  h1{font-size:34px;}

  .filterCard,
  .tableCard{
    border-radius:26px;
    padding:18px;
  }
}
</style>
</head>

<body>

<div class="page">

  <div class="header">
    <div class="brand">AURUM HOUSE</div>
    <h1>出勤統計報表</h1>
    <div class="subtitle">Attendance Report</div>
  </div>

  <div class="filterCard">
    <div class="filterGrid">
      <input type="month" id="month">
      <input type="text" id="name" placeholder="員工姓名">
      <input type="text" id="department" placeholder="部門">
    </div>

    <div class="actionGrid">
      <button class="search" onclick="loadReport()">查詢</button>
      <button class="clear" onclick="clearFilter()">清除</button>
      <button class="export" onclick="exportCSV()">匯出 CSV</button>
      <button class="back" onclick="location.href='/dashboard.html'">返回後台</button>
    </div>
  </div>

  <div id="monthTitle" class="monthTitle"></div>

  <div class="tableCard">
    <div class="tableWrap">
      <table>
        <thead>
          <tr>
            <th>月份</th>
            <th>員工</th>
            <th>部門</th>
            <th>職稱</th>
            <th>出勤天數</th>
            <th>總工時</th>
            <th>平均工時</th>
            <th>遲到次數</th>
            <th>早退次數</th>
          </tr>
        </thead>

        <tbody id="tbody">
          <tr>
            <td colspan="9">讀取中...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<script>
if(localStorage.getItem("adminLogin") !== "yes"){
  window.location.href = "/login.html";
}

let reportRows = [];

function getCurrentMonth(){
  const now = new Date();
  const y = now.getFullYear();
  const m = String(now.getMonth() + 1).padStart(2, "0");
  return `${y}-${m}`;
}

function getMonthRange(monthValue){
  if(!monthValue){
    return {
      startDate:"",
      endDate:"",
      label:"全部月份"
    };
  }

  const [year, month] =
  monthValue.split("-").map(Number);

  const startDate =
  `${year}-${String(month).padStart(2,"0")}-01`;

  const lastDay =
  new Date(year, month, 0).getDate();

  const endDate =
  `${year}-${String(month).padStart(2,"0")}-${String(lastDay).padStart(2,"0")}`;

  return {
    startDate,
    endDate,
    label:`${year} 年 ${month} 月`
  };
}

function formatHoursMinutes(hours){
  const totalMinutes =
  Math.round(Number(hours || 0) * 60);

  const h =
  Math.floor(totalMinutes / 60);

  const m =
  totalMinutes % 60;

  return `${h}小時${m}分鐘`;
}

async function loadReport(){
  const tbody =
  document.getElementById("tbody");

  const monthTitle =
  document.getElementById("monthTitle");

  tbody.innerHTML =
  `<tr><td colspan="9">讀取中...</td></tr>`;

  const params =
  new URLSearchParams();

  const month =
  document.getElementById("month").value;

  const name =
  document.getElementById("name").value.trim();

  const department =
  document.getElementById("department").value.trim();

  const range =
  getMonthRange(month);

  monthTitle.innerText =
  "報表月份：" + range.label;

  if(name){
    params.append("name", name);
  }

  if(department){
    params.append("department", department);
  }

  if(range.startDate){
    params.append("startDate", range.startDate);
  }

  if(range.endDate){
    params.append("endDate", range.endDate);
  }

  try{
    let url = "/api/attendance-report";

    if(params.toString()){
      url += "?" + params.toString();
    }

    const res =
    await fetch(url);

    const data =
    await res.json();

    if(!Array.isArray(data) || data.length === 0){
      reportRows = [];

      tbody.innerHTML =
      `<tr><td colspan="9">目前沒有報表資料</td></tr>`;

      return;
    }

    reportRows =
    data.map(item=>({
      month:range.label,
      name:item.name || "-",
      department:item.department || "-",
      position:item.position || "-",
      workDays:Number(item.workDays || 0),
      totalHours:Number(item.totalHours || 0),
      averageHours:Number(item.averageHours || 0),
      lateCount:Number(item.lateCount || 0),
      earlyLeaveCount:Number(item.earlyLeaveCount || 0)
    }));

    renderTable();

  }catch(err){
    console.error(err);

    reportRows = [];

    tbody.innerHTML =
    `<tr><td colspan="9">讀取失敗</td></tr>`;
  }
}

function renderTable(){
  const tbody =
  document.getElementById("tbody");

  let html = "";

  reportRows.forEach(item=>{
    html += `
      <tr>
        <td>${item.month}</td>
        <td>${item.name}</td>
        <td>${item.department}</td>
        <td>${item.position}</td>
        <td>${item.workDays}</td>
        <td>${formatHoursMinutes(item.totalHours)}</td>
        <td>${formatHoursMinutes(item.averageHours)}</td>
        <td class="${item.lateCount > 0 ? "bad" : "good"}">${item.lateCount}</td>
        <td class="${item.earlyLeaveCount > 0 ? "bad" : "good"}">${item.earlyLeaveCount}</td>
      </tr>
    `;
  });

  tbody.innerHTML = html;
}

function clearFilter(){
  document.getElementById("month").value = getCurrentMonth();
  document.getElementById("name").value = "";
  document.getElementById("department").value = "";

  loadReport();
}

function exportCSV(){
  if(!reportRows || reportRows.length === 0){
    alert("沒有資料可匯出");
    return;
  }

  let csv =
  "\uFEFF月份,員工,部門,職稱,出勤天數,總工時,平均工時,遲到次數,早退次數\n";

  reportRows.forEach(item=>{
    csv += [
      item.month,
      item.name,
      item.department,
      item.position,
      item.workDays,
      formatHoursMinutes(item.totalHours),
      formatHoursMinutes(item.averageHours),
      item.lateCount,
      item.earlyLeaveCount
    ].map(v =>
      `"${String(v).replace(/"/g,'""')}"`
    ).join(",") + "\n";
  });

  const blob =
  new Blob([csv], {
    type:"text/csv;charset=utf-8;"
  });

  const url =
  URL.createObjectURL(blob);

  const a =
  document.createElement("a");

  const month =
  document.getElementById("month").value || "all";

  a.href = url;
  a.download =
  `attendance-report-${month}.csv`;

  a.click();

  URL.revokeObjectURL(url);
}

document.getElementById("month").value =
getCurrentMonth();

loadReport();
</script>

</body>
</html>
