<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>員工代墊申請</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>
*{box-sizing:border-box;}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:radial-gradient(circle at top,#fff8ea 0%,#f4ead9 45%,#eadcc8 100%);
  color:#10201d;
}

.page{
  min-height:100vh;
  padding:24px 18px 44px;
}

.header{
  text-align:center;
  margin:18px 0 26px;
}

.brand{
  font-size:14px;
  letter-spacing:6px;
  color:#a9792b;
  font-weight:900;
}

h1{
  margin:12px 0 6px;
  font-size:38px;
  color:#0b3029;
  letter-spacing:3px;
}

.subtitle{
  color:#8b7d69;
  font-size:15px;
  letter-spacing:1px;
}

.card{
  max-width:620px;
  margin:0 auto;
  padding:24px;
  border-radius:34px;
  background:rgba(255,255,255,.94);
  border:1px solid #e4d4b8;
  box-shadow:0 26px 60px rgba(66,43,16,.16);
}

.employee{
  background:#fffaf3;
  border:1px solid #eadfcf;
  border-radius:22px;
  padding:18px;
  margin-bottom:22px;
  color:#0b3029;
  font-weight:950;
  line-height:1.7;
}

.summaryBox{
  background:linear-gradient(135deg,#cfa54f,#8b5f1e);
  color:white;
  padding:24px;
  border-radius:24px;
  text-align:center;
  margin-bottom:22px;
  box-shadow:0 16px 30px rgba(139,95,30,.25);
}

.summaryTitle{
  font-size:14px;
  opacity:.9;
  letter-spacing:1px;
}

.summaryMoney{
  margin-top:10px;
  font-size:38px;
  font-weight:950;
}

.formGroup{
  margin-bottom:18px;

}

label{
  display:block;
  margin-bottom:8px;
  color:#756957;
  font-weight:900;
}

input,
select,
textarea{
  width:100%;
  max-width:100%;
  padding:16px;
  border:1px solid #d8c8ad;
  border-radius:18px;
  background:#fffdf8;
  color:#10201d;
  font-size:16px;
  outline:none;
  box-sizing:border-box;
}

input[type="date"],
input[type="number"],
select{
  height:64px;
}

input[type="date"]{
  appearance:none;
  -webkit-appearance:none;
  min-width:0;
}

textarea{
  resize:vertical;
  min-height:110px;
  line-height:1.7;
}

input:focus,
select:focus,
textarea:focus{
  border-color:#cfa54f;
  box-shadow:0 0 0 3px rgba(207,165,79,.18);
}

.fileHint{
  margin-top:8px;
  color:#8b7d69;
  font-size:14px;
  line-height:1.7;
}

.preview{
  margin-top:14px;
  text-align:center;
}

.preview img{
  max-width:100%;
  border-radius:20px;
  border:1px solid #eadfcf;
  box-shadow:0 10px 30px rgba(0,0,0,.08);
  display:none;
}

button{
  width:100%;
  padding:16px;
  border:none;
  border-radius:20px;
  color:white;
  font-size:18px;
  font-weight:950;
  cursor:pointer;
  margin-top:16px;
}

.submit{
  background:linear-gradient(135deg,#cfa54f,#8b5f1e);
}

.back{
  background:linear-gradient(135deg,#10201d,#050b0a);
}

.note{
  margin-top:18px;
  background:#fffaf3;
  border:1px solid #eadfcf;
  border-radius:18px;
  padding:14px;
  color:#756957;
  font-size:14px;
  line-height:1.7;
}

#status{
  margin-top:18px;
  text-align:center;
  font-weight:950;
}

.success{color:#166534;}
.error{color:#b91c1c;}
.info{color:#8a5f1e;}

@media(max-width:480px){
  h1{
    font-size:34px;
  }

  .card{
    padding:20px;
    border-radius:30px;
  }

  .summaryMoney{
    font-size:34px;
  }

  input,
  select,
  textarea{
    font-size:16px;
  }
}
</style>

</head>

<body>

<div class="page">

  <div class="header">

    <div class="brand">
      AURUM HOUSE
    </div>

    <h1>
      員工代墊申請
    </h1>

    <div class="subtitle">
      Expense Reimbursement
    </div>

  </div>

  <div class="card">

    <div id="employeeName" class="employee">
      LINE 登入中...
    </div>

    <div class="summaryBox">

      <div class="summaryTitle">
        本次申請金額
      </div>

      <div class="summaryMoney" id="previewAmount">
        NT$0
      </div>

    </div>

    <div class="formGroup">

      <label>
        代墊日期
      </label>

      <input
      type="date"
      id="expenseDate">

    </div>

    <div class="formGroup">

      <label>
        代墊類別
      </label>

      <select id="category">

        <option value="交通費">
          交通費
        </option>

        <option value="餐費">
          餐費
        </option>

        <option value="材料費">
          材料費
        </option>

        <option value="文具費">
          文具費
        </option>

        <option value="客戶招待">
          客戶招待
        </option>

        <option value="差旅費">
          差旅費
        </option>

        <option value="其他">
          其他
        </option>

      </select>

    </div>

    <div class="formGroup">

      <label>
        代墊金額
      </label>

      <input
      type="number"
      id="amount"
      placeholder="請輸入代墊金額">

    </div>

    <div class="formGroup">

      <label>
        費用說明
      </label>

      <textarea
      id="description"
      placeholder="例如：停車費、材料採購、客戶拜訪交通費、計程車費...">
      </textarea>

    </div>

    <div class="formGroup">

      <label>
        發票 / 收據照片
      </label>

      <input
      type="file"
      id="receipt"
      accept="image/*"
      capture="environment">

      <div class="fileHint">
        支援手機拍照或上傳相簿照片
      </div>

      <div class="preview">
        <img id="previewImage">
      </div>

    </div>

    <button
    class="submit"
    onclick="submitReimbursement()">

      送出代墊申請

    </button>

    <button
    class="back"
    onclick="goBack()">

      返回員工專區

    </button>

    <div class="note">

      代墊申請送出後將進入管理後台審核。

      <br><br>

      審核通過後可由管理員進行付款登記。

      <br><br>

      請務必附上發票或收據照片。

    </div>

    <div id="status"></div>

  </div>

</div>

<script>

const LIFF_ID =
"2010241581-YtDxQgWd";

let profile = null;
let employee = null;

function setStatus(message,type){

  document.getElementById("status").innerHTML =
  `<span class="${type || 'info'}">${message}</span>`;

}

function goBack(){

  if(document.referrer){

    history.back();

  }else{

    location.href="/employee-home.html";

  }

}

function setToday(){

  const now = new Date();

  const y =
  now.getFullYear();

  const m =
  String(now.getMonth()+1)
  .padStart(2,"0");

  const d =
  String(now.getDate())
  .padStart(2,"0");

  document.getElementById(
    "expenseDate"
  ).value =
  `${y}-${m}-${d}`;

}

document
.getElementById("amount")
.addEventListener("input",function(){

  document
  .getElementById("previewAmount")
  .innerHTML =
  "NT$" +
  Number(this.value || 0)
  .toLocaleString("zh-TW");

});

document
.getElementById("receipt")
.addEventListener("change",function(){

  const file =
  this.files[0];

  const img =
  document.getElementById(
    "previewImage"
  );

  if(!file){

    img.src = "";

    img.style.display =
    "none";

    return;

  }

  img.src =
  URL.createObjectURL(file);

  img.style.display =
  "block";

});

async function init(){

  try{

    await liff.init({
      liffId: LIFF_ID
    });

    if(!liff.isLoggedIn()){

      liff.login();

      return;

    }

    profile =
    await liff.getProfile();

    const empRes =
    await fetch(
      "/api/check-employee/" +
      profile.userId
    );

    const empData =
    await empRes.json();

    if(
      empData.success &&
      empData.isEmployee
    ){

      employee =
      empData.employee;

      document.getElementById(
        "employeeName"
      ).innerHTML =
      `
      員工：
      <b>${employee.name}</b>
      <br>
      部門：
      ${employee.department || "-"}
      /
      ${employee.position || "-"}
      `;

    }else{

      employee = {
        name:
        profile.displayName
      };

      document.getElementById(
        "employeeName"
      ).innerHTML =
      `
      員工：
      <b>${profile.displayName}</b>
      `;
    }

    setToday();

  }catch(err){

    console.error(err);

    document.getElementById(
      "employeeName"
    ).innerHTML =
    "<span class='error'>LINE 登入失敗</span>";

    setStatus(
      "請使用 LINE 開啟此頁面",
      "error"
    );

  }

}

async function uploadReceipt(){

  const file =
  document
  .getElementById("receipt")
  .files[0];

  if(!file){

    return "";

  }

  const fd =
  new FormData();

  fd.append(
    "receipt",
    file
  );

  const res =
  await fetch(
    "/api/upload-receipt",
    {
      method:"POST",
      body:fd
    }
  );

  const data =
  await res.json();

  if(
    !res.ok ||
    data.success === false
  ){

    throw new Error(
      data.message ||
      "發票上傳失敗"
    );

  }

  return data.url || "";

}

async function submitReimbursement(){

  if(!profile){

    alert(
      "尚未完成 LINE 登入"
    );

    return;

  }

  if(!employee){

    alert(
      "尚未取得員工資料"
    );

    return;

  }

  const expenseDate =
  document.getElementById(
    "expenseDate"
  ).value;

  const category =
  document.getElementById(
    "category"
  ).value;

  const amount =
  document.getElementById(
    "amount"
  ).value;

  const description =
  document.getElementById(
    "description"
  ).value.trim();

  if(!expenseDate){

    alert("請選擇代墊日期");

    return;

  }

  if(
    !amount ||
    Number(amount) <= 0
  ){

    alert("請輸入正確金額");

    return;

  }

  try{

    setStatus(
      "發票上傳中...",
      "info"
    );

    const receiptUrl =
    await uploadReceipt();

    setStatus(
      "代墊申請送出中...",
      "info"
    );

    const res =
    await fetch(
      "/api/reimbursement",
      {
        method:"POST",
        headers:{
          "Content-Type":
          "application/json"
        },
        body:JSON.stringify({

          lineUserId:
          profile.userId,

          name:
          employee.name,

          expenseDate,

          category,

          amount,

          description,

          receiptUrl

        })
      }
    );

    const data =
    await res.json();

    if(
      !res.ok ||
      data.success === false
    ){

      setStatus(
        data.message ||
        "送出失敗",
        "error"
      );

      return;

    }

    setStatus(
      "✅ " +
      (
        data.message ||
        "代墊申請已送出"
      ),
      "success"
    );

    document
    .getElementById(
      "amount"
    ).value = "";

    document
    .getElementById(
      "description"
    ).value = "";

    document
    .getElementById(
      "receipt"
    ).value = "";

    document
    .getElementById(
      "previewImage"
    ).style.display =
    "none";

    document
    .getElementById(
      "previewImage"
    ).src = "";

    document
    .getElementById(
      "previewAmount"
    ).innerHTML =
    "NT$0";

  }catch(err){

    console.error(err);

    setStatus(
      err.message ||
      "送出失敗",
      "error"
    );

  }

}

init();

</script>

</body>
</html>
