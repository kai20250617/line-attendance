<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>我的薪資歷史</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>
*{box-sizing:border-box;}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:radial-gradient(circle at top,#fff8ea 0%,#f4ead9 45%,#eadcc8 100%);
  color:#10201d;
  padding:24px 18px 44px;
}

.header{
  text-align:center;
  margin:18px 0 26px;
}

.brand{
  font-size:14px;
  letter-spacing:6px;
  color:#a9792b;
  font-weight:900;
}

h1{
  margin:12px 0 6px;
  font-size:38px;
  color:#0b3029;
  letter-spacing:3px;
}

.subtitle{
  color:#8b7d69;
  font-size:15px;
  letter-spacing:1px;
}

.card{
  max-width:680px;
  margin:0 auto;
  padding:24px;
  border-radius:34px;
  background:rgba(255,255,255,.94);
  border:1px solid #e4d4b8;
  box-shadow:0 26px 60px rgba(66,43,16,.16);
}

.filter{
  background:#fffaf3;
  border:1px solid #eadfcf;
  border-radius:22px;
  padding:18px;
  margin-bottom:20px;
}

.filterGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

label{
  display:block;
  margin-bottom:8px;
  color:#756957;
  font-weight:900;
}

select{
  width:100%;
  height:58px;
  padding:0 16px;
  border:1px solid #d8c8ad;
  border-radius:18px;
  background:#fffdf8;
  color:#10201d;
  font-size:16px;
  outline:none;
}

.btnGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:14px;
}

button{
  width:100%;
  padding:15px;
  border:none;
  border-radius:18px;
  color:white;
  font-size:17px;
  font-weight:950;
  cursor:pointer;
}

.filterBtn{
  background:linear-gradient(135deg,#cfa54f,#8b5f1e);
}

.clear{
  background:linear-gradient(135deg,#756957,#3b3025);
}

.pdf{
  background:linear-gradient(135deg,#123c35,#071b17);
}

.sign{
  background:linear-gradient(135deg,#cfa54f,#8b5f1e);
}

.signedBtn{
  background:#777;
}

.backBtn{
  background:linear-gradient(135deg,#10201d,#050b0a);
  margin-top:18px;
}

.item{
  background:#fffaf3;
  border:1px solid #eadfcf;
  border-radius:22px;
  padding:20px;
  margin-bottom:16px;
  text-align:left;
}

.month{
  font-size:28px;
  font-weight:950;
  color:#0b3029;
}

.moneyBox{
  margin-top:14px;
  display:grid;
  gap:10px;
}

.moneyRow{
  display:flex;
  justify-content:space-between;
  gap:12px;
  border-bottom:1px solid #eadfcf;
  padding:10px 0;
}

.moneyRow span{
  color:#756957;
  font-weight:900;
}

.moneyRow strong{
  color:#10201d;
  text-align:right;
}

.net{
  font-size:22px;
  color:#0b3029;
  font-weight:950;
}

.status{
  display:inline-block;
  margin-top:14px;
  padding:8px 13px;
  border-radius:999px;
  font-size:15px;
  font-weight:950;
}

.statusSigned{
  background:#e7f7ec;
  color:#166534;
}

.statusUnsigned{
  background:#fdecec;
  color:#991b1b;
}

.signedTime{
  color:#756957;
  font-weight:800;
  margin-top:10px;
  line-height:1.7;
}

.actionGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:16px;
}

.empty,
.loading{
  text-align:center;
  color:#8b7d69;
  font-weight:900;
  padding:32px 10px;
}

.error{
  color:#b91c1c;
  font-weight:950;
  text-align:center;
}

@media(max-width:480px){
  h1{
    font-size:34px;
  }

  .card{
    padding:20px;
    border-radius:30px;
  }

  .filterGrid,
  .btnGrid,
  .actionGrid{
    grid-template-columns:1fr;
  }

  .month{
    font-size:25px;
  }
}
</style>
</head>

<body>

<div class="header">
  <div class="brand">AURUM HOUSE</div>
  <h1>我的薪資歷史</h1>
  <div class="subtitle">Salary History</div>
</div>

<div class="card">

  <div class="filter">

    <div class="filterGrid">

      <div>
        <label>年份</label>
        <select id="yearFilter">
          <option value="">全部年份</option>
        </select>
      </div>

      <div>
        <label>月份</label>
        <select id="monthFilter">
          <option value="">全部月份</option>
          <option value="1">1 月</option>
          <option value="2">2 月</option>
          <option value="3">3 月</option>
          <option value="4">4 月</option>
          <option value="5">5 月</option>
          <option value="6">6 月</option>
          <option value="7">7 月</option>
          <option value="8">8 月</option>
          <option value="9">9 月</option>
          <option value="10">10 月</option>
          <option value="11">11 月</option>
          <option value="12">12 月</option>
        </select>
      </div>

    </div>

    <div class="btnGrid">
      <button class="filterBtn" onclick="renderList()">
        篩選
      </button>

      <button class="clear" onclick="clearFilter()">
        清除
      </button>
    </div>

  </div>

  <div id="list">
    <div class="loading">LINE 登入中...</div>
  </div>

  <button class="backBtn" onclick="goBack()">
    返回員工專區
  </button>

</div>

<script>
const LIFF_ID = "2010241581-YtDxQgWd";

let salaryHistory = [];
let employeeId = null;

function goBack(){
  if(document.referrer){
    history.back();
  }else{
    location.href="/employee-home.html";
  }
}

async function init(){
  const list =
  document.getElementById("list");

  try{
    await liff.init({
      liffId:LIFF_ID
    });

    if(!liff.isLoggedIn()){
      liff.login();
      return;
    }

    const profile =
    await liff.getProfile();

    const salaryRes =
    await fetch("/api/my-salary/" + profile.userId);

    const salaryData =
    await salaryRes.json();

    if(salaryData.success){
      employeeId =
      salaryData.employeeId;
    }

    const res =
    await fetch("/api/my-salary-history/" + profile.userId);

    const data =
    await res.json();

    if(!data.success){
      list.innerHTML =
      "<div class='error'>讀取薪資歷史失敗</div>";
      return;
    }

    salaryHistory =
    data.data || data.rows || [];

    buildYearFilter();
    renderList();

  }catch(err){
    console.error(err);

    list.innerHTML =
    "<div class='error'>讀取失敗，請稍後再試</div>";
  }
}

function getYearMonth(item){
  let year = item.year;
  let month = item.month;

  if((!year || !month) && item.salary_month){
    const parts =
    String(item.salary_month).split("-");

    year = parts[0];
    month = parts[1];
  }

  return {
    year: year ? Number(year) : null,
    month: month ? Number(month) : null
  };
}

function buildYearFilter(){
  const yearFilter =
  document.getElementById("yearFilter");

  yearFilter.innerHTML =
  `<option value="">全部年份</option>`;

  let years = [];

  salaryHistory.forEach(item=>{
    const ym =
    getYearMonth(item);

    if(ym.year){
      years.push(ym.year);
    }
  });

  years =
  [...new Set(years)]
  .sort((a,b)=>b-a);

  years.forEach(year=>{
    yearFilter.innerHTML += `
      <option value="${year}">
        ${year} 年
      </option>
    `;
  });
}

function renderList(){
  const list =
  document.getElementById("list");

  const year =
  document.getElementById("yearFilter").value;

  const month =
  document.getElementById("monthFilter").value;

  let rows =
  salaryHistory.filter(item=>{
    const ym =
    getYearMonth(item);

    if(
      year &&
      Number(ym.year) !== Number(year)
    ){
      return false;
    }

    if(
      month &&
      Number(ym.month) !== Number(month)
    ){
      return false;
    }

    return true;
  });

  rows =
  rows.sort((a,b)=>{
    const ay =
    getYearMonth(a);

    const by =
    getYearMonth(b);

    return (
      Number(by.year || 0) * 100 + Number(by.month || 0)
    ) - (
      Number(ay.year || 0) * 100 + Number(ay.month || 0)
    );
  });

  if(rows.length === 0){
    list.innerHTML =
    "<div class='empty'>目前沒有符合條件的薪資紀錄</div>";
    return;
  }

  let html = "";

  rows.forEach(item=>{
    const gross =
    Number(
      item.gross_salary ||
      item.grossSalary ||
      item.gross ||
      item.total_salary ||
      item.totalSalary ||
      0
    );

    const net =
    Number(
      item.net_salary ||
      item.netSalary ||
      item.net ||
      item.final_salary ||
      item.finalSalary ||
      0
    );

    const ym =
    getYearMonth(item);

    const y =
    ym.year || "-";

    const m =
    ym.month
    ? String(ym.month).padStart(2,"0")
    : "-";

    const signedText =
    item.is_signed
    ? "已簽收"
    : "未簽收";

    const statusClass =
    item.is_signed
    ? "statusSigned"
    : "statusUnsigned";

    const signedTime =
    item.signed_at
    ? new Date(item.signed_at).toLocaleString("zh-TW", {
        timeZone:"Asia/Taipei"
      })
    : "";

    html += `
      <div class="item">

        <div class="month">
          ${y} 年 ${m} 月
        </div>

        <div class="moneyBox">

          <div class="moneyRow">
            <span>應發薪資</span>
            <strong>NT$${gross.toLocaleString("zh-TW")}</strong>
          </div>

          <div class="moneyRow net">
            <span>實發薪資</span>
            <strong>NT$${net.toLocaleString("zh-TW")}</strong>
          </div>

        </div>

        <div class="status ${statusClass}">
          ${signedText}
        </div>

        ${
          signedTime
          ? `<div class="signedTime">簽收時間：${signedTime}</div>`
          : ""
        }

        <div class="actionGrid">

          <button class="pdf" onclick="downloadPdf()">
            下載 PDF
          </button>

          ${
            item.is_signed
            ? `<button class="signedBtn" disabled>已簽收</button>`
            : `<button class="sign" onclick="signSalary(${item.id})">薪資單簽收</button>`
          }

        </div>

      </div>
    `;
  });

  list.innerHTML =
  html;
}

function clearFilter(){
  document.getElementById("yearFilter").value = "";
  document.getElementById("monthFilter").value = "";

  renderList();
}

function downloadPdf(){
  if(!employeeId){
    alert("找不到員工 ID，無法下載 PDF");
    return;
  }

  location.href =
  "/api/payslip/" + employeeId;
}

async function signSalary(id){
  if(!id){
    alert("找不到薪資紀錄 ID");
    return;
  }

  if(!confirm("確認簽收本月薪資單？")){

    return;

  }

  try{

    const res =

    await fetch(

      "/api/sign-salary/" + id,

      {

        method:"POST"

      }

    );

    const data =

    await res.json();

    alert(

      data.message ||

      "簽收完成"

    );

    location.reload();

  }catch(err){

    console.error(err);

    alert("簽收失敗，請稍後再試");

  }

}

init();

</script>

</body>

</html>
