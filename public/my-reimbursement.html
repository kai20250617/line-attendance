<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>我的代墊紀錄</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:radial-gradient(circle at top,#fff8ea 0%,#f4ead9 45%,#eadcc8 100%);
  color:#10201d;
}

.container{
  max-width:900px;
  margin:auto;
  padding:24px 18px 44px;
}

.header{
  text-align:center;
  margin:18px 0 26px;
}

.brand{
  font-size:14px;
  letter-spacing:6px;
  color:#a9792b;
  font-weight:900;
}

h1{
  margin:12px 0 6px;
  font-size:38px;
  color:#0b3029;
  letter-spacing:3px;
}

.subtitle{
  color:#8b7d69;
  font-size:15px;
  letter-spacing:1px;
}

.employeeBox{
  background:rgba(255,255,255,.94);
  border:1px solid #e4d4b8;
  border-radius:26px;
  padding:18px;
  margin-bottom:18px;
  color:#0b3029;
  font-weight:950;
  line-height:1.7;
  box-shadow:0 16px 40px rgba(66,43,16,.12);
}

.summary{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-bottom:20px;
}

.summaryCard{
  background:rgba(255,255,255,.94);
  border:1px solid #e4d4b8;
  border-radius:24px;
  padding:18px;
  text-align:center;
  box-shadow:0 16px 40px rgba(66,43,16,.12);
}

.summaryTitle{
  color:#756957;
  font-size:14px;
  font-weight:900;
}

.summaryValue{
  margin-top:8px;
  font-size:28px;
  font-weight:950;
  color:#0b3029;
}

.card{
  background:rgba(255,255,255,.94);
  border:1px solid #e4d4b8;
  border-radius:28px;
  padding:22px;
  margin-bottom:18px;
  box-shadow:0 16px 40px rgba(66,43,16,.12);
}

.cardTop{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px;
  margin-bottom:14px;
}

.date{
  font-size:20px;
  font-weight:950;
  color:#0b3029;
}

.amount{
  background:linear-gradient(135deg,#cfa54f,#8b5f1e);
  color:white;
  padding:10px 16px;
  border-radius:999px;
  font-weight:950;
  white-space:nowrap;
}

.row{
  margin-bottom:8px;
  color:#756957;
  font-weight:850;
  line-height:1.8;
}

.row b{
  color:#10201d;
}

.badges{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:14px;
}

.badge{
  padding:8px 14px;
  border-radius:999px;
  font-weight:950;
  font-size:14px;
}

.pending{
  background:#fff3cd;
  color:#b45309;
}

.approved{
  background:#dcfce7;
  color:#166534;
}

.rejected{
  background:#fee2e2;
  color:#991b1b;
}

.paid{
  background:#dbeafe;
  color:#1d4ed8;
}

.receipt{
  margin-top:16px;
}

.receipt img{
  width:100%;
  max-width:280px;
  border-radius:18px;
  border:1px solid #eadfcf;
  box-shadow:0 10px 26px rgba(0,0,0,.10);
}

.empty,
.loading{
  text-align:center;
  padding:34px 16px;
  background:rgba(255,255,255,.94);
  border:1px solid #e4d4b8;
  border-radius:24px;
  color:#8b7d69;
  font-weight:900;
}

.back{
  width:100%;
  padding:16px;
  border:none;
  border-radius:20px;
  background:linear-gradient(135deg,#10201d,#050b0a);
  color:white;
  font-size:18px;
  font-weight:950;
  margin-top:20px;
  cursor:pointer;
}

.error{
  color:#b91c1c;
  font-weight:950;
}

@media(max-width:480px){
  h1{
    font-size:34px;
  }

  .summary{
    grid-template-columns:1fr;
  }

  .cardTop{
    flex-direction:column;
  }

  .amount{
    align-self:flex-start;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <div class="brand">AURUM HOUSE</div>
    <h1>我的代墊紀錄</h1>
    <div class="subtitle">Reimbursement History</div>
  </div>

  <div id="employeeBox" class="employeeBox">
    LINE 登入中...
  </div>

  <div class="summary">

    <div class="summaryCard">
      <div class="summaryTitle">申請筆數</div>
      <div class="summaryValue" id="totalCount">0</div>
    </div>

    <div class="summaryCard">
      <div class="summaryTitle">待審核</div>
      <div class="summaryValue" id="pendingCount">0</div>
    </div>

    <div class="summaryCard">
      <div class="summaryTitle">已付款</div>
      <div class="summaryValue" id="paidCount">0</div>
    </div>

  </div>

  <div id="list">
    <div class="loading">載入中...</div>
  </div>

  <button class="back" onclick="goBack()">
    返回員工專區
  </button>

</div>

<script>
const LIFF_ID = "2010241581-YtDxQgWd";

function goBack(){
  if(document.referrer){
    history.back();
  }else{
    location.href="/employee-home.html";
  }
}

function formatDate(value){

  if(!value){
    return "-";
  }

  const d = new Date(value);

  if(isNaN(d.getTime())){
    return String(value).substring(0,10);
  }

  const weeks = [
    "星期日",
    "星期一",
    "星期二",
    "星期三",
    "星期四",
    "星期五",
    "星期六"
  ];

  const dateText =
  d.toLocaleDateString("zh-TW",{
    timeZone:"Asia/Taipei",
    year:"numeric",
    month:"2-digit",
    day:"2-digit"
  });

  return `
    ${dateText}
    <div style="
      margin-top:4px;
      color:#a9792b;
      font-size:13px;
      font-weight:900;
    ">
      ${weeks[d.getDay()]}
    </div>
  `;

}
function money(value){
  return "NT$" + Number(value || 0).toLocaleString("zh-TW");
}

function statusBadge(status){
  if(status === "已核准" || status === "核准"){
    return "approved";
  }

  if(status === "已駁回" || status === "駁回"){
    return "rejected";
  }

  return "pending";
}

function paymentBadge(status){
  if(status === "已付款"){
    return "paid";
  }

  return "pending";
}

async function loadData(){
  const list = document.getElementById("list");
  const employeeBox = document.getElementById("employeeBox");

  try{
    await liff.init({
      liffId:LIFF_ID
    });

    if(!liff.isLoggedIn()){
      liff.login();
      return;
    }

    const profile =
    await liff.getProfile();

    const empRes =
    await fetch(
      "/api/check-employee/" +
      profile.userId
    );

    const empData =
    await empRes.json();

    if(empData.success && empData.isEmployee){
      employeeBox.innerHTML =
      `員工：${empData.employee.name || profile.displayName || "-"}<br>
       部門：${empData.employee.department || "-"} / ${empData.employee.position || "-"}`;
    }else{
      employeeBox.innerHTML =
      `員工：${profile.displayName}`;
    }

    const res =
    await fetch(
      "/api/my-reimbursements/" +
      profile.userId
    );

    const data =
    await res.json();

    if(!Array.isArray(data) || data.length === 0){
      document.getElementById("totalCount").innerHTML = "0";
      document.getElementById("pendingCount").innerHTML = "0";
      document.getElementById("paidCount").innerHTML = "0";

      list.innerHTML =
      `
      <div class="empty">
        尚無代墊紀錄
      </div>
      `;

      return;
    }

    document.getElementById("totalCount").innerHTML =
    data.length;

    document.getElementById("pendingCount").innerHTML =
    data.filter(item =>
      (item.status || "待審核") === "待審核"
    ).length;

    document.getElementById("paidCount").innerHTML =
    data.filter(item =>
      item.payment_status === "已付款"
    ).length;

    list.innerHTML =
    data.map(item=>`

      <div class="card">

        <div class="cardTop">

         <div class="date">
  ${formatDate(item.expense_date)}
</div>

          <div class="amount">
            ${money(item.amount)}
          </div>

        </div>

        <div class="row">
          <b>類別：</b>${item.category || "-"}
        </div>

        <div class="row">
          <b>說明：</b>${item.description || "-"}
        </div>

        <div class="badges">

          <span class="badge ${statusBadge(item.status)}">
            ${item.status || "待審核"}
          </span>

          <span class="badge ${paymentBadge(item.payment_status)}">
            ${item.payment_status || "未付款"}
          </span>

        </div>

        ${
          item.receipt_url
          ?
          `
          <div class="receipt">
            <a href="${item.receipt_url}" target="_blank">
              <img src="${item.receipt_url}">
            </a>
          </div>
          `
          :
          ""
        }

      </div>

    `).join("");

  }catch(err){
    console.error(err);

    employeeBox.innerHTML =
    "<span class='error'>LINE 登入失敗</span>";

    list.innerHTML =
    `
    <div class="empty error">
      讀取失敗，請稍後再試
    </div>
    `;
  }
}

loadData();
</script>

</body>
</html>
