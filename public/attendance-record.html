<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>員工出勤紀錄</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:radial-gradient(circle at top,#fff8ea 0%,#f4ead9 45%,#eadcc8 100%);
  color:#10201d;
  padding:24px 18px 44px;
}

.page{
  max-width:1180px;
  margin:0 auto;
}

.header{
  text-align:center;
  margin:18px 0 26px;
}

.brand{
  font-size:14px;
  letter-spacing:6px;
  color:#a9792b;
  font-weight:900;
}

h1{
  margin:12px 0 6px;
  font-size:38px;
  color:#0b3029;
  letter-spacing:3px;
}

.subtitle{
  color:#8b7d69;
  font-size:15px;
  letter-spacing:1px;
}

.filterCard{
  background:rgba(255,255,255,.94);
  border:1px solid #e4d4b8;
  border-radius:30px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 18px 40px rgba(66,43,16,.12);
}

.filterGrid{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:12px;
}

input{
  width:100%;
  height:56px;
  padding:0 14px;
  border:1px solid #d8c8ad;
  border-radius:18px;
  background:#fffdf8;
  color:#10201d;
  font-size:15px;
  outline:none;
}

input:focus{
  border-color:#cfa54f;
  box-shadow:0 0 0 3px rgba(207,165,79,.18);
}

.actionGrid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:12px;
  margin-top:14px;
}

button{
  width:100%;
  padding:13px 14px;
  border:none;
  border-radius:18px;
  color:white;
  font-size:15px;
  font-weight:950;
  cursor:pointer;
}

.search,
.refresh{
  background:linear-gradient(135deg,#cfa54f,#8b5f1e);
}

.export{
  background:linear-gradient(135deg,#166534,#064e3b);
}

.clear{
  background:linear-gradient(135deg,#756957,#3b3025);
}

.back{
  background:linear-gradient(135deg,#10201d,#050b0a);
}

.list{
  display:grid;
  gap:16px;
}

.recordCard{
  background:rgba(255,255,255,.94);
  border:1px solid #e4d4b8;
  border-radius:30px;
  padding:20px;
  box-shadow:0 18px 40px rgba(66,43,16,.12);
}

.recordTop{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:14px;
  margin-bottom:14px;
}

.empName{
  font-size:24px;
  font-weight:950;
  color:#0b3029;
}

.dateText{
  margin-top:6px;
  color:#756957;
  font-weight:850;
}

.workBadge{
  background:linear-gradient(135deg,#cfa54f,#8b5f1e);
  color:white;
  padding:10px 15px;
  border-radius:999px;
  font-weight:950;
  white-space:nowrap;
}

.infoGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:12px;
}

.infoBox{
  background:#fffaf3;
  border:1px solid #eadfcf;
  border-radius:18px;
  padding:14px;
  line-height:1.7;
}

.infoLabel{
  color:#756957;
  font-weight:900;
  font-size:14px;
  margin-bottom:6px;
}

.weekday{
  color:#0b3029;
  font-weight:950;
}

.weekend{
  color:#b91c1c;
  font-weight:950;
}

.missing{
  color:#b91c1c;
  font-weight:950;
}

.mapArea{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:14px;
}

.map-btn{
  display:block;
  text-align:center;
  color:white;
  text-decoration:none;
  padding:12px;
  border-radius:18px;
  font-weight:950;
  background:linear-gradient(135deg,#123c35,#071b17);
}

.empty,
.loading{
  background:rgba(255,255,255,.94);
  border:1px solid #e4d4b8;
  border-radius:26px;
  padding:30px;
  text-align:center;
  color:#8b7d69;
  font-weight:900;
}

.error{
  color:#b91c1c;
  font-weight:950;
}

@media(max-width:800px){
  .filterGrid,
  .actionGrid,
  .infoGrid,
  .mapArea{
    grid-template-columns:1fr;
  }

  .recordTop{
    flex-direction:column;
  }

  .workBadge{
    align-self:flex-start;
  }
}

@media(max-width:480px){
  h1{
    font-size:34px;
  }

  .filterCard,
  .recordCard{
    border-radius:26px;
    padding:18px;
  }
}
</style>
</head>

<body>

<div class="page">

  <div class="header">
    <div class="brand">AURUM HOUSE</div>
    <h1>員工出勤紀錄</h1>
    <div class="subtitle">Attendance Records</div>
  </div>

  <div class="filterCard">

    <div class="filterGrid">
      <input type="text" id="searchName" placeholder="搜尋姓名">
      <input type="date" id="startDate">
      <input type="date" id="endDate">
    </div>

    <div class="actionGrid">
      <button class="search" onclick="loadAttendance()">查詢</button>
      <button class="clear" onclick="clearFilter()">清除</button>
      <button class="export" onclick="exportCSV()">匯出 CSV</button>
      <button class="refresh" onclick="loadAttendance()">重新整理</button>
      <button class="back" onclick="location.href='/dashboard.html'">返回後台</button>
    </div>

  </div>

  <div id="list" class="list">
    <div class="loading">讀取中...</div>
  </div>

</div>

<script>
if(localStorage.getItem("adminLogin") !== "yes"){
  window.location.href = "/login.html";
}

let rows = [];
const addressCache = {};

function formatTime(value){
  if(!value){
    return "-";
  }

  const d = new Date(value);

  if(isNaN(d.getTime())){
    return "-";
  }

  return d.toLocaleTimeString("zh-TW", {
    timeZone:"Asia/Taipei",
    hour:"2-digit",
    minute:"2-digit",
    second:"2-digit"
  });
}

function safeText(value){
  if(
    !value ||
    value === "undefined" ||
    value === "null"
  ){
    return "-";
  }

  return value;
}

function getWeekday(value){
  const d = new Date(value);

  const week = [
    "星期日",
    "星期一",
    "星期二",
    "星期三",
    "星期四",
    "星期五",
    "星期六"
  ];

  return week[d.getDay()];
}

function getWeekdayClass(weekday){
  if(weekday === "星期日" || weekday === "星期六"){
    return "weekend";
  }

  return "weekday";
}

function calcBreakHours(startTime,endTime){
  const start = new Date(startTime);
  const end = new Date(endTime);

  if(isNaN(start.getTime()) || isNaN(end.getTime())){
    return 0;
  }

  const lunchStart = new Date(start);
  lunchStart.setHours(12,0,0,0);

  const lunchEnd = new Date(start);
  lunchEnd.setHours(13,0,0,0);

  const overlapStart =
  start > lunchStart ? start : lunchStart;

  const overlapEnd =
  end < lunchEnd ? end : lunchEnd;

  const overlapMs =
  overlapEnd - overlapStart;

  if(overlapMs <= 0){
    return 0;
  }

  return overlapMs / 1000 / 60 / 60;
}

function formatHoursMinutes(hours){
  const totalMinutes =
  Math.round(Number(hours || 0) * 60);

  const h =
  Math.floor(totalMinutes / 60);

  const m =
  totalMinutes % 60;

  return `${h}小時${m}分鐘`;
}

function mapLink(lat,lng,text){
  if(!lat || !lng){
    return "";
  }

  return `
    <a class="map-btn" target="_blank"
      href="https://maps.google.com/?q=${lat},${lng}">
      ${text}
    </a>
  `;
}

async function getAddress(lat,lng){
  if(!lat || !lng){
    return "-";
  }

  const key = lat + "," + lng;

  if(addressCache[key]){
    return addressCache[key];
  }

  try{
    const res = await fetch(
      `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`
    );

    const data = await res.json();

    const address =
    data.display_name || "-";

    addressCache[key] = address;

    return address;

  }catch(err){
    console.error(err);
    return "地址解析失敗";
  }
}

function groupRawAttendance(rawRows){
  const groups = {};

  rawRows.forEach(row=>{
    const date =
    new Date(row.clock_time)
    .toLocaleDateString("zh-TW", {
      timeZone:"Asia/Taipei"
    });

    const weekday =
    getWeekday(row.clock_time);

    const key =
    `${row.line_user_id || row.name}_${date}`;

    if(!groups[key]){
      groups[key] = {
        name: row.name || "-",
        date,
        weekday,

        start_time:null,
        end_time:null,

        start_location:null,
        end_location:null,

        start_latitude:null,
        start_longitude:null,

        end_latitude:null,
        end_longitude:null,

        work_hours:null,
        break_hours:null
      };
    }

    if(row.type === "上班"){
      groups[key].start_time = row.clock_time;
      groups[key].start_location = row.address || row.location || row.address_text || row.location_text || "";
      groups[key].start_latitude = row.latitude;
      groups[key].start_longitude = row.longitude;
    }

    if(row.type === "下班"){
      groups[key].end_time = row.clock_time;
      groups[key].end_location = row.address || row.location || row.address_text || row.location_text || "";
      groups[key].end_latitude = row.latitude;
      groups[key].end_longitude = row.longitude;
    }
  });

 const result =

  Object.values(groups).map(item=>{

    if(item.start_time && item.end_time){

      const rawHours =

      (new Date(item.end_time) - new Date(item.start_time)) /

      1000 / 60 / 60;

      const breakDeduct =

      calcBreakHours(

        item.start_time,

        item.end_time

      );

      item.break_hours =

      breakDeduct;

      item.work_hours =

      Math.max(

        0,

        rawHours - breakDeduct

      );

    }

    return item;

  });

  result.sort((a,b)=>{

    const at =

    new Date(a.end_time || a.start_time || 0).getTime();

    const bt =

    new Date(b.end_time || b.start_time || 0).getTime();

    return bt - at;

  });

  return result;

}

async function loadAttendance(){

  const list =

  document.getElementById("list");

  list.innerHTML =

  "<div class='loading'>載入中...</div>";

  try{

    const name =

    document.getElementById("searchName").value.trim();

    const startDate =

    document.getElementById("startDate").value;

    const endDate =

    document.getElementById("endDate").value;

    const params =

    new URLSearchParams();

    if(name){

      params.append("name", name);

    }

    if(startDate){

      params.append("startDate", startDate);

    }

    if(endDate){

      params.append("endDate", endDate);

    }

    let url = "/api/attendance";

    if(params.toString()){

      url += "?" + params.toString();

    }

    const response =

    await fetch(url);

    const rawRows =

    await response.json();

    if(

      rawRows.length > 0 &&

      rawRows[0].clock_time

    ){

      rows =

      groupRawAttendance(rawRows);

    }else{

      rows =

      rawRows;

    }

    if(!Array.isArray(rows) || rows.length === 0){

      list.innerHTML =

      "<div class='empty'>目前沒有出勤紀錄</div>";

      return;

    }

    renderCards();

  }catch(error){

    console.error(error);

    list.innerHTML =

    "<div class='empty error'>讀取失敗</div>";

  }

}

function renderCards(){

  const list =

  document.getElementById("list");

  let html = "";

  rows.forEach((row,index)=>{

    let workText = "-";

    let breakText = "-";

    if(row.start_time && row.end_time){

      const rawHours =

      (new Date(row.end_time) - new Date(row.start_time)) /

      1000 / 60 / 60;

      const breakDeduct =

      calcBreakHours(

        row.start_time,

        row.end_time

      );

      const workHours =

      Math.max(

        0,

        rawHours - breakDeduct

      );

      workText =

      formatHoursMinutes(workHours);

      breakText =

      formatHoursMinutes(breakDeduct);

    }else if(

      row.work_hours !== null &&

      row.work_hours !== undefined

    ){

      workText =

      formatHoursMinutes(row.work_hours);

    }

    html += `

      <div class="recordCard">

        <div class="recordTop">

          <div>

            <div class="empName">

              ${safeText(row.name)}

            </div>

            <div class="dateText">

              ${safeText(row.date)}

              ｜

              <span class="${getWeekdayClass(row.weekday)}">

                ${safeText(row.weekday)}

              </span>

            </div>

          </div>

          <div class="workBadge">

            ${workText}

          </div>

        </div>

        <div class="infoGrid">

          <div class="infoBox">

            <div class="infoLabel">上班時間</div>

            ${

              row.start_time

              ? formatTime(row.start_time)

              : `<span class="missing">缺上班</span>`

            }

          </div>

          <div class="infoBox">

            <div class="infoLabel">下班時間</div>

            ${

              row.end_time

              ? formatTime(row.end_time)

              : `<span class="missing">缺下班</span>`

            }

          </div>

          <div class="infoBox">

            <div class="infoLabel">休息時數</div>

            ${breakText}

          </div>

          <div class="infoBox">

            <div class="infoLabel">上班位置</div>

            <span id="start_addr_${index}">

              ${

                row.start_location

                ? safeText(row.start_location)

                : "解析中..."

              }

            </span>

          </div>

          <div class="infoBox">

            <div class="infoLabel">下班位置</div>

            <span id="end_addr_${index}">

              ${

                row.end_location

                ? safeText(row.end_location)

                : "解析中..."

              }

            </span>

          </div>

          <div class="infoBox">

            <div class="infoLabel">地圖</div>

            <div class="mapArea">

              ${mapLink(row.start_latitude,row.start_longitude,"上班地圖")}

              ${mapLink(row.end_latitude,row.end_longitude,"下班地圖")}

            </div>

          </div>

        </div>

      </div>

    `;

  });

  list.innerHTML = html;

  rows.forEach(async (row,index)=>{

    if(!row.start_location){

      const el =

      document.getElementById("start_addr_" + index);

      if(el){

        el.innerText =

        await getAddress(row.start_latitude,row.start_longitude);

      }

    }

    if(!row.end_location){

      const el =

      document.getElementById("end_addr_" + index);

      if(el){

        el.innerText =

        await getAddress(row.end_latitude,row.end_longitude);

      }

    }

  });

}

function clearFilter(){

  document.getElementById("searchName").value = "";

  document.getElementById("startDate").value = "";

  document.getElementById("endDate").value = "";

  loadAttendance();

}

function exportCSV(){

  if(!rows || rows.length === 0){

    alert("沒有資料可匯出");

    return;

  }

  let csv =

  "\uFEFF姓名,日期,星期,上班時間,下班時間,工時,休息時數,上班位置,下班位置\n";

  rows.forEach(row=>{

    let workText = "";

    let breakText = "";

    if(row.start_time && row.end_time){

      const rawHours =

      (new Date(row.end_time) - new Date(row.start_time)) /

      1000 / 60 / 60;

      const breakDeduct =

      calcBreakHours(

        row.start_time,

        row.end_time

      );

      const workHours =

      Math.max(

        0,

        rawHours - breakDeduct

      );

      workText =

      formatHoursMinutes(workHours);

      breakText =

      formatHoursMinutes(breakDeduct);

    }else if(

      row.work_hours !== null &&

      row.work_hours !== undefined

    ){

      workText =

      formatHoursMinutes(row.work_hours);

    }

    csv += [

      row.name,

      row.date,

      row.weekday,

      formatTime(row.start_time),

      formatTime(row.end_time),

      workText,

      breakText,

      safeText(row.start_location),

      safeText(row.end_location)

    ].map(v =>

      `"${String(v).replace(/"/g,'""')}"`

    ).join(",") + "\n";

  });

  const blob =

  new Blob([csv], {

    type:"text/csv;charset=utf-8;"

  });

  const url =

  URL.createObjectURL(blob);

  const a =

  document.createElement("a");

  a.href = url;

  a.download = "attendance-record.csv";

  a.click();

  URL.revokeObjectURL(url);

}

loadAttendance();

</script>

</body>

</html>
